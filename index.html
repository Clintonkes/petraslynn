<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Decodes the path public/404.html encoded before redirecting here,
      // restoring the real URL so React Router mounts on the right route.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
        // Where the site lives, decided here rather than at build time, so one
        // build works on <user>.github.io/<repo>/ and on any custom domain,
        // including one added after the last deploy. Every asset path in the
        // build is relative to this <base>, and the router reads it too.
        var base = document.createElement('base');
        base.href = /\.github\.io$/.test(l.hostname) ? '/' + l.pathname.split('/')[1] + '/' : '/';
        document.head.appendChild(base);
      })(window.location);
    </script>
    <!-- Replaced at build time with a script that preloads the top photo of
         the page being opened (see vite.config.ts). It must stay below the
         script above, which restores the real path and sets <base>, and above
         the stylesheets, which would otherwise delay it. -->
    <!--entry-image-preload-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15271d" />
    <link rel="icon" href="/petraslynn-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://images.pexels.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking the first paint; text shows in the fallback
         font for a moment, then swaps. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <title>Petraslynn LLC | Lawn Care and Landscaping in Aurora, Colorado</title>
    <meta name="description" content="Petraslynn LLC is a licensed and insured lawn care and landscaping company in Aurora, Colorado, serving the Denver metro area with precision mowing, hedge and shrub pruning, seasonal cleanups, irrigation, turf care and custom landscape design. Request a free estimate." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Petraslynn LLC" />
    <meta property="og:title" content="Petraslynn LLC | Lawn Care and Landscaping in Aurora, Colorado" />
    <meta property="og:description" content="Petraslynn LLC is a licensed and insured lawn care and landscaping company in Aurora, Colorado, serving the Denver metro area with precision mowing, hedge and shrub pruning, seasonal cleanups, irrigation, turf care and custom landscape design. Request a free estimate." />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
